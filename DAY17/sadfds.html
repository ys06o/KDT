<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot-Now Real App Demo</title>
    <style>
        :root {
            --primary: #5E5CE6;
            --accent: #FF2D55; 
            --success: #30D158;
            --food: #FF9500;
            --official: #AF52DE;
            --bg: #000;
            --glass: rgba(28, 28, 30, 0.9);
            --text: #ffffff;
            --gray: #8E8E93;
        }

        body { margin: 0; background: #1a1a1a; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text); overflow: hidden; }
        .phone { width: 375px; height: 812px; background: var(--bg); border-radius: 40px; position: relative; overflow: hidden; border: 10px solid #333; box-shadow: 0 0 60px rgba(94, 92, 230, 0.3); }

        /* 상단 상태바 */
        .status-bar { padding: 15px 25px 5px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; z-index: 1000; position: relative; }

        /* 화면 컨테이너 */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; transition: 0.3s; display: none; flex-direction: column; }
        .screen.active { display: flex; }

        /* [TAB 1] 지도 화면 */
        .map-layer { flex: 1; position: relative; background: radial-gradient(circle at 50% 40%, #2c2c2e 0%, #000 80%); overflow: hidden; }
        .grid { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px); background-size: 40px 40px; opacity: 0.2; transform: perspective(500px) rotateX(20deg); }

        /* [TAB 2] 공지/소식 화면 (새로 만든 칸) */
        .feed-header { padding: 50px 20px 15px; background: #000; border-bottom: 1px solid #222; }
        .feed-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
        
        /* 공지 카드 스타일 */
        .notice-card { background: #1C1C1E; border-radius: 20px; overflow: hidden; border: 1px solid #333; }
        .notice-img { width: 100%; height: 160px; background: linear-gradient(45deg, var(--official), var(--primary)); display: flex; justify-content: center; align-items: center; font-size: 40px; }
        .notice-content { padding: 15px; }
        .notice-tag { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }

        /* 핀 디자인 */
        .pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .pin-head { width: 40px; height: 40px; border-radius: 50% 50% 0 50%; transform: rotate(45deg); border: 3px solid #fff; display: flex; justify-content: center; align-items: center; }
        .pin-icon { transform: rotate(-45deg); font-size: 20px; }

        /* 하단 탭바 */
        .tab-bar { height: 80px; background: rgba(10, 10, 10, 0.95); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 15px; border-top: 1px solid #222; z-index: 500; position: absolute; bottom: 0; width: 100%; }
        .tab { color: var(--gray); text-align: center; font-size: 10px; cursor: pointer; }
        .tab.active { color: var(--primary); }
        .tab-icon { font-size: 24px; margin-bottom: 4px; display: block; }

        .btn-view { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="phone">
        <div class="status-bar"><span>13:45</span><div style="display: flex; gap: 5px;"><span>📶</span><span>🔋</span></div></div>

        <div id="screen-map" class="screen active">
            <div class="map-layer">
                <div class="grid"></div>
                <div class="pin" style="top: 40%; left: 50%;">
                    <div class="pin-head" style="background:var(--official)"><span class="pin-icon">📢</span></div>
                    <div style="margin-top:5px; font-size:10px; font-weight:bold;">학생회 공지</div>
                </div>
                <div style="position: absolute; top:70%; left:45%; width:12px; height:12px; background:#3b82f6; border:2px solid white; border-radius:50%;"></div>
            </div>
            <div style="position:absolute; bottom:100px; left:20px; right:20px; background:var(--glass); padding:15px; border-radius:15px; backdrop-filter:blur(10px); border:1px solid #444;">
                <div style="font-size:12px; color:var(--primary); font-weight:bold;">NOW</div>
                <div style="font-size:14px;">성결관 근처에서 엽떡 공구 중!</div>
            </div>
        </div>

        <div id="screen-feed" class="screen">
            <div class="feed-header">
                <h1 style="margin:0; font-size:24px;">Campus News</h1>
            </div>
            <div class="feed-area">
                <div class="notice-card">
                    <div class="notice-img">🎨</div>
                    <div class="notice-content">
                        <span class="notice-tag" style="background:var(--official); color:white;">학생회</span>
                        <div style="font-weight:bold; font-size:16px; margin-bottom:5px;">2026 성결대 굿즈 디자인 공모전</div>
                        <div style="color:var(--gray); font-size:13px; margin-bottom:12px;">이번 축제에 쓰일 굿즈를 직접 디자인해보세요! 상금 50만원.</div>
                        <button class="btn-view">자세히 보기</button>
                    </div>
                </div>

                <div class="notice-card">
                    <div class="notice-img" style="background: linear-gradient(45deg, #444, #222);">🎓</div>
                    <div class="notice-content">
                        <span class="notice-tag" style="background:var(--gray); color:white;">학사지원</span>
                        <div style="font-weight:bold; font-size:16px; margin-bottom:5px;">[중요] 1학기 수강신청 일정 안내</div>
                        <div style="color:var(--gray); font-size:13px; margin-bottom:12px;">2월 2일부터 시작되는 수강신청 장바구니 일정을 확인하세요.</div>
                        <button class="btn-view">일정 확인</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-bar">
            <div id="tab-map" class="tab active" onclick="switchTab('map')"><span class="tab-icon">🗺️</span>지도</div>
            <div id="tab-feed" class="tab" onclick="switchTab('feed')"><span class="tab-icon">📰</span>소식</div>
            <div class="tab"><span class="tab-icon">👤</span>나</div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // 모든 화면 숨기기
            document.getElementById('screen-map').classList.remove('active');
            document.getElementById('screen-feed').classList.remove('active');
            
            // 모든 탭 비활성화
            document.getElementById('tab-map').classList.remove('active');
            document.getElementById('tab-feed').classList.remove('active');

            // 선택한 탭 활성화
            if(tabName === 'map') {
                document.getElementById('screen-map').classList.add('active');
                document.getElementById('tab-map').classList.add('active');
            } else if(tabName === 'feed') {
                document.getElementById('screen-feed').classList.add('active');
                document.getElementById('tab-feed').classList.add('active');
            }
        }
    </script>
</body>
</html>
